name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Integrity checks
        run: node scripts/ci-check.js

      - name: Fresh setup smoke
        run: |
          npm run setup
          test -f PROGRESS.md
          npm run setup
          npm run export
          test -n "$(ls onboarding-report-*.txt 2>/dev/null)"
